services:
  - type: web
    name: nexora-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn hola:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VIRTUAL_EMPLOYEE_ADMIN_KEY
        generateValue: true
      - key: VIRTUAL_EMPLOYEE_DATABASE
        value: /var/data/virtual_employee.db
    disk:
      name: nexora-data
      mountPath: /var/data
      sizeGB: 1
